<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasir Septri Ponsel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Tata letak: satu bingkai aplikasi, bilah merek di atas, halaman bergantian di bawahnya.
   Warna diambil dari logo toko: merah muda panas, magenta tua, dan merah muda lembut. */
:root {
  --bg: #fff4f8;
  --surface: #ffffff;
  --tint: #fde6ef;
  --line: #f1c1d4;
  --ink: #42102a;
  --ink-soft: #85455f;
  --pink: #d81b60;
  --pink-deep: #ad1457;
  --wine: #7a0c3d;
  --on-pink: #ffffff;
  --sel: #ffd3e4;
  --ok: #1b7a4b;
  --err: #b3261e;
  --warn: #8a5a00;
  --font-display: "Dancing Script", "Segoe Script", cursive;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(1100px 420px at 50% -8%, #ffd2e3 0%, transparent 62%), var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--font-body);
  min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
h1, h2, h3, p { margin: 0; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

.shell { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* ---------- Bilah merek ---------- */
.brandbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brandbar .logo { width: 48px; height: 48px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line); }
.wordmark { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1; color: var(--pink-deep); }
.chip { margin-left: auto; padding: 6px 14px; border-radius: 999px; background: var(--tint); color: var(--wine); font-weight: 600; font-size: 0.9rem; }

/* ---------- Tombol ---------- */
.btn {
  appearance: none; cursor: pointer;
  padding: 9px 16px; border-radius: 10px;
  border: 1.5px solid var(--pink); background: var(--surface); color: var(--wine);
  font-weight: 600; line-height: 1.2;
  transition: background .15s, color .15s, transform .1s;
}
.btn:hover { background: var(--tint); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--pink); color: var(--on-pink); }
.btn.primary:hover { background: var(--pink-deep); border-color: var(--pink-deep); }
.btn.ghost { border-color: var(--line); }
:is(.btn, input, select, .tile, tr[tabindex]):focus-visible { outline: 3px solid #ff8db7; outline-offset: 2px; }

/* ---------- Kartu & panel ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel > .cap { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }

/* ---------- Login ---------- */
#login { display: grid; place-items: center; min-height: calc(100vh - 80px); }
.logincard { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 28px 28px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 18px 40px -24px rgba(173, 20, 87, .45); }
.logincard .logo { width: 132px; height: 132px; border-radius: 50%; align-self: center; box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--line); }
.logincard h1 { text-align: center; font-size: 1.05rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--wine); margin-top: 6px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 0.85rem; font-weight: 600; color: var(--ink-soft); }
.field input, .field select, .qty input, .bayar input {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #fffafc;
}
.field input:focus, .field select:focus, .qty input:focus, .bayar input:focus { border-color: var(--pink); outline: none; box-shadow: 0 0 0 3px #ffc2d9; }
.logincard .btn { margin-top: 6px; padding: 11px 16px; }
.hint { text-align: center; font-size: 0.8rem; color: var(--ink-soft); }

/* ---------- Dashboard ---------- */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; text-align: center; min-width: 0; }
.stat .cap { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
.stat .val { font-size: 1.7rem; font-weight: 700; color: var(--wine); overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tile { appearance: none; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 20px 22px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); color: var(--wine); font-weight: 700; font-size: 1.05rem; text-align: left; transition: background .15s, border-color .15s; }
.tile:hover { background: var(--tint); border-color: var(--pink); }
.tile svg { width: 28px; height: 28px; flex: none; fill: none; stroke: var(--pink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tile.main { background: var(--pink); border-color: var(--pink); color: var(--on-pink); }
.tile.main:hover { background: var(--pink-deep); }
.tile.main svg { stroke: var(--on-pink); }

/* ---------- Tabel ---------- */
.tablewrap { overflow: auto; max-height: 300px; border: 1px solid var(--line); border-radius: 12px; }
.tablewrap.tall { max-height: 56vh; }
table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
th { position: sticky; top: 0; background: var(--tint); color: var(--wine); text-align: left; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 9px 12px; white-space: nowrap; }
td { padding: 9px 12px; border-top: 1px solid #f8dde8; white-space: nowrap; }
th.num, td.num { text-align: right; }
tbody tr[data-i] { cursor: pointer; }
tbody tr[data-i]:hover { background: #fff0f6; }
tbody tr.sel { background: var(--sel); font-weight: 600; }
td.kosong { text-align: center; color: var(--ink-soft); padding: 22px 12px; white-space: normal; }

/* ---------- Kasir ---------- */
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.split th, .split td { padding: 9px 8px; }
.split table { font-size: 0.88rem; }
.checkout { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.qty { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.qty input { width: 84px; }
.total { font-size: 1.35rem; font-weight: 700; color: var(--wine); margin-right: 8px; }
.bayar { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.bayar input { width: 150px; }
.kembali { font-weight: 700; color: var(--ok); margin: 0 6px; }
.row .spacer { flex: 1 1 0; }

/* ---------- Bilah aksi halaman ---------- */
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Dialog ---------- */
.layer { position: fixed; inset: 0; background: rgba(66, 16, 42, .45); display: grid; place-items: center; padding: 16px; overflow: auto; }
.dlg { width: 100%; max-width: 440px; background: var(--surface); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 60px -20px rgba(66, 16, 42, .7); max-height: calc(100vh - 32px); }
.dlg h3 { font-size: 1.1rem; color: var(--wine); }
.dlg-body { overflow: auto; min-height: 0; }
.dlg-act { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.form-grid { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 10px 12px; align-items: center; }
.form-grid label { font-weight: 600; color: var(--ink-soft); }
.form-grid input { width: 100%; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 10px; background: #fffafc; }
.form-grid input:focus { border-color: var(--pink); outline: none; box-shadow: 0 0 0 3px #ffc2d9; }
.form-grid input[readonly] { background: var(--tint); color: var(--ink-soft); }
pre.struk { margin: 0; padding: 14px; background: #fffdf9; border: 1px dashed #e6b3c8; border-radius: 10px; font: 400 12.5px/1.5 var(--font-mono); color: #2a1a22; overflow: auto; }

@media (max-width: 860px) {
  .split { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .stats, .tiles { grid-template-columns: minmax(0, 1fr); }
  .logincard { padding: 22px 18px 20px; }
  .bayar input { width: 120px; }
  h1 { font-size: 1.3rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* Cetak: hanya struk yang keluar di kertas */
@media print {
  body { background: #fff; padding: 0; }
  .shell { display: none !important; }
  .layer { position: static; background: none; padding: 0; display: block; }
  .layer:not(:last-of-type) { display: none !important; }
  .dlg { box-shadow: none; max-width: none; padding: 0; max-height: none; }
  .dlg h3, .dlg-act { display: none !important; }
  pre.struk { border: none; font-size: 12px; }
}
</style>
</head>

  <section id="produk" hidden>
    <div class="shell">
      <h1>Kelola Produk (Admin)</h1>
      <div class="panel">
        <div class="tablewrap tall"><table id="tblProdukAdmin"></table></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="bTambah" type="button">Tambah</button>
        <button class="btn" id="bUbah" type="button">Ubah</button>

<script>
/**
 * Aplikasi Kasir Penjualan Handphone (satu berkas HTML, tanpa database).
 * Konversi dari Shponsel.java (Java Swing). Nama variabel, fungsi, dan struktur data
 * sengaja dibuat sama dengan versi Java.
 *
 * Akun bawaan:
 *   Admin -> username: septri | password: septri123
 * Fitur: Admin, Dashboard, Keranjang, Pembelian,
 *        Cetak Struk, Detail Pembelian, Detail Transaksi, Kelola Produk (admin).
 */

// ====== Sesi ======
let userAktif = "", roleAktif = "";
let noTrx = 1;

// ====== UTIL ======
// Padanan DefaultTableModel: kolom + baris, dengan penanda perubahan untuk tampilan tabel.
function model(...kolom) {
  const m = {
    kolom: kolom, rows: [], listeners: [],
    addRow(r) { this.rows.push(r); this.fire(false); },
    removeRow(i) { this.rows.splice(i, 1); this.fire(true); },
    setRowCount(n) { this.rows.length = n; this.fire(true); },
    getRowCount() { return this.rows.length; },
    getValueAt(r, c) { return this.rows[r][c]; },
    setValueAt(v, r, c) { this.rows[r][c] = v; this.fire(false); },
    fire(reset) { this.listeners.forEach(f => f(reset)); }
  };
  return m;
}

function rp(n) {
  return "Rp " + Math.trunc(n).toLocaleString("en-US").replace(/,/g, ".");
}

function angka(s) {
  const d = String(s).replace(/[^0-9]/g, "");
  return d === "" ? 0 : parseInt(d, 10);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function padEnd(s, n) { s = String(s); return s.length >= n ? s : s + " ".repeat(n - s.length); }
function padStart(s, n) { s = String(s); return s.length >= n ? s : " ".repeat(n - s.length) + s; }
function dua(n) { return String(n).padStart(2, "0"); }

function formatTanggal(d) {
  return dua(d.getDate()) + "/" + dua(d.getMonth() + 1) + "/" + d.getFullYear() + " " + dua(d.getHours()) + ":" + dua(d.getMinutes());
}

// ====== Data (tabel dipakai sebagai penyimpanan sederhana) ======
const mProduk = model("ID", "Nama HP", "Harga", "Stok");
const mKeranjang = model("ID", "Nama HP", "Harga", "Qty", "Subtotal");
const mTransaksi = model("No Transaksi", "Tanggal", "Kasir", "Total", "Bayar", "Kembali");
const detailTrx = new Map(); // noTrx -> [nama, harga, qty, subtotal]

function isiDataAwal() {
  mProduk.addRow(["P001", "Samsung Galaxy A15", 2999000, 10]);
  mProduk.addRow(["P002", "Xiaomi Redmi Note 13", 2799000, 8]);
  mProduk.addRow(["P003", "iPhone 13 128GB", 9999000, 5]);
  mProduk.addRow(["P004", "OPPO A58", 2499000, 12]);
  mProduk.addRow(["P005", "Vivo Y27", 2399000, 7]);
}

// ====== Tampilan tabel (padanan JTable) ======
const T = { f: v => v };
const N = { f: v => v, num: true };
const R = { f: v => rp(v), num: true };

function buatTabel(el, m, fmt, kosong) {
  let sel = -1;
  function render() {
    const kepala = "<thead><tr>" + m.kolom.map((k, i) =>
      '<th class="' + (fmt[i].num ? "num" : "") + '">' + esc(k) + "</th>").join("") + "</tr></thead>";
    let isi;
    if (m.rows.length === 0) {
      isi = '<tr><td class="kosong" colspan="' + m.kolom.length + '">' + esc(kosong) + "</td></tr>";
    } else {
      isi = m.rows.map((r, ri) =>
        '<tr data-i="' + ri + '" tabindex="0" class="' + (ri === sel ? "sel" : "") + '">' +
        r.map((v, ci) => '<td class="' + (fmt[ci].num ? "num" : "") + '">' + esc(fmt[ci].f(v)) + "</td>").join("") +
        "</tr>").join("");
    }
    el.innerHTML = kepala + "<tbody>" + isi + "</tbody>";
  }
  function pilih(e) {
    const tr = e.target.closest("tr[data-i]");
    if (!tr) return;
    sel = parseInt(tr.dataset.i, 10);
    render();
    const baru = el.querySelector('tr[data-i="' + sel + '"]');
    if (baru && e.type === "keydown") baru.focus();
  }
  el.addEventListener("click", pilih);
  el.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pilih(e); }
  });
  m.listeners.push(reset => {
    if (reset || sel >= m.rows.length) sel = -1;
    render();
  });
  render();
  return {
    getSelectedRow() { return sel; },
    clearSelection() { sel = -1; render(); }
  };
}

const tProdukJual = buatTabel(document.getElementById("tblProdukJual"), mProduk, [T, T, R, N], "Belum ada produk.");
const tKeranjang = buatTabel(document.getElementById("tblKeranjang"), mKeranjang, [T, T, R, N, R], "Keranjang masih kosong.");
const tTransaksi = buatTabel(document.getElementById("tblTransaksi"), mTransaksi, [T, T, T, R, R, R], "Belum ada transaksi.");
const tProdukAdmin = buatTabel(document.getElementById("tblProdukAdmin"), mProduk, [T, T, R, N], "Belum ada produk.");

// ====== Komponen yang perlu diakses ulang ======
const txtUser = document.getElementById("txtUser");
const txtPass = document.getElementById("txtPass");
const cmbRole = document.getElementById("cmbRole");
const lblWelcome = document.getElementById("lblWelcome");
const lblJmlProduk = document.getElementById("lblJmlProduk");
const lblJmlTrx = document.getElementById("lblJmlTrx");
const lblOmzet = document.getElementById("lblOmzet");
const lblTotal = document.getElementById("lblTotal");
const lblKembali = document.getElementById("lblKembali");
const btnKelolaProduk = document.getElementById("btnKelolaProduk");
const spQty = document.getElementById("spQty");
const txtBayar = document.getElementById("txtBayar");
const brandbar = document.getElementById("brandbar");
const chipUser = document.getElementById("chipUser");

// ====================== DIALOG (padanan JOptionPane / JDialog) ======================
let zModal = 100;
function dialog(opsi) {
  const sebelumnya = document.activeElement;
  const layer = document.createElement("div");
  layer.className = "layer";
  layer.style.zIndex = String(++zModal);
  const kartu = document.createElement("div");
  kartu.className = "dlg";
  kartu.setAttribute("role", "dialog");
  kartu.setAttribute("aria-modal", "true");
  if (opsi.lebar) kartu.style.maxWidth = opsi.lebar;

  const h = document.createElement("h3");
  h.textContent = opsi.judul;
  const isi = document.createElement("div");
  isi.className = "dlg-body";
  if (typeof opsi.isi === "string") isi.textContent = opsi.isi; else isi.appendChild(opsi.isi);
  const aksi = document.createElement("div");
  aksi.className = "dlg-act";

  function tutup() {
    layer.remove();
    document.removeEventListener("keydown", onKey);
    if (sebelumnya && sebelumnya.focus) sebelumnya.focus();
  }
  function onKey(e) {
    const layers = document.querySelectorAll(".layer");
    if (e.key === "Escape" && layers[layers.length - 1] === layer) tutup();
  }
  let utama = null;
  opsi.tombol.forEach(t => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn" + (t.utama ? " primary" : "");
    b.textContent = t.label;
    b.addEventListener("click", () => {
      if (t.aksi && t.aksi() === false) return;
      tutup();
    });
    if (t.utama) utama = b;
    aksi.appendChild(b);
  });
  kartu.append(h, isi, aksi);
  layer.appendChild(kartu);
  document.body.appendChild(layer);
  document.addEventListener("keydown", onKey);
  const pertama = kartu.querySelector("input:not([readonly])");
  (pertama || utama || kartu).focus();
  return { tutup: tutup };
}

function info(pesan, judul) {
  dialog({ judul: judul || "Informasi", isi: pesan, tombol: [{ label: "OK", utama: true }] });
}

function peringatan(pesan, judul) { info(pesan, judul || "Peringatan"); }

// ====================== NAVIGASI ======================
const halamanAda = ["login", "dashboard", "penjualan", "transaksi", "produk"];
function tampilkan(halaman) {
  halamanAda.forEach(h => { document.getElementById(h).hidden = (h !== halaman); });
  brandbar.hidden = (halaman === "login");
  window.scrollTo(0, 0);
}

function pindah(halaman) {
  if (halaman === "dashboard") refreshDashboard();
  if (halaman === "penjualan") { tProdukJual.clearSelection(); hitungTotal(); }
  tampilkan(halaman);
}

// ====================== LOGIN ======================
function prosesLogin() {
  const u = txtUser.value.trim();
  const pw = txtPass.value;
  const role = cmbRole.value;

  const ok = (role === "Pengguna" && u === "kasir" && pw === "kasir123")
          || (role === "Admin" && u === "septri" && pw === "septri123");
  if (!ok) {
    dialog({ judul: "Login Gagal", isi: "Username / password / role salah!", tombol: [{ label: "OK", utama: true }] });
    return;
  }
  userAktif = u;
  roleAktif = role;
  txtUser.value = "";
  txtPass.value = "";
  btnKelolaProduk.hidden = (role !== "Admin");
  pindah("dashboard");
}

function logout() {
  mKeranjang.setRowCount(0);
  userAktif = roleAktif = "";
  tampilkan("login");
  txtUser.focus();
}

// ====================== DASHBOARD ======================
function refreshDashboard() {
  lblWelcome.textContent = "Dashboard - " + userAktif + " (" + roleAktif + ")";
  chipUser.textContent = userAktif + " (" + roleAktif + ")";
  lblJmlProduk.textContent = String(mProduk.getRowCount());
  lblJmlTrx.textContent = String(mTransaksi.getRowCount());
  let omzet = 0;
  for (let i = 0; i < mTransaksi.getRowCount(); i++) omzet += mTransaksi.getValueAt(i, 3);
  lblOmzet.textContent = rp(omzet);
}

// ====================== PENJUALAN + KERANJANG ======================
function nilaiQty() {
  let q = parseInt(spQty.value, 10);
  if (isNaN(q) || q < 1) q = 1;
  if (q > 999) q = 999;
  return q;
}

function tambahKeranjang() {
  const r = tProdukJual.getSelectedRow();
  if (r < 0) { info("Pilih produk dulu."); return; }
  const id = mProduk.getValueAt(r, 0);
  const nama = mProduk.getValueAt(r, 1);
  const harga = mProduk.getValueAt(r, 2);
  const stok = mProduk.getValueAt(r, 3);
  const qty = nilaiQty();

  let idx = -1;
  for (let i = 0; i < mKeranjang.getRowCount(); i++)
    if (mKeranjang.getValueAt(i, 0) === id) { idx = i; break; }

  const sudahDiKeranjang = idx >= 0 ? mKeranjang.getValueAt(idx, 3) : 0;
  if (sudahDiKeranjang + qty > stok) {
    peringatan("Stok tidak cukup! Stok tersedia: " + stok);
    return;
  }
  if (idx >= 0) {
    const q = sudahDiKeranjang + qty;
    mKeranjang.setValueAt(q, idx, 3);
    mKeranjang.setValueAt(q * harga, idx, 4);
  } else {
    mKeranjang.addRow([id, nama, harga, qty, qty * harga]);
  }
  spQty.value = 1;
  hitungTotal();
}

function totalKeranjang() {
  let t = 0;
  for (let i = 0; i < mKeranjang.getRowCount(); i++) t += mKeranjang.getValueAt(i, 4);
  return t;
}

function hitungTotal() {
  const total = totalKeranjang();
  lblTotal.textContent = "Total: " + rp(total);
  const bayar = angka(txtBayar.value);
  lblKembali.textContent = "Kembali: " + rp(Math.max(0, bayar - total));
}

// ====================== FITUR PEMBELIAN ======================
function prosesPembelian() {
  if (mKeranjang.getRowCount() === 0) { info("Keranjang masih kosong."); return; }
  const total = totalKeranjang();
  const bayar = angka(txtBayar.value);
  if (bayar < total) {
    peringatan("Uang bayar kurang!");
    return;
  }
  const kembali = bayar - total;
  const no = "TRX-" + String(noTrx++).padStart(4, "0");
  const tgl = formatTanggal(new Date());

  const items = [];
  for (let i = 0; i < mKeranjang.getRowCount(); i++) {
    const id = mKeranjang.getValueAt(i, 0);
    const qty = mKeranjang.getValueAt(i, 3);
    items.push([mKeranjang.getValueAt(i, 1), mKeranjang.getValueAt(i, 2), qty, mKeranjang.getValueAt(i, 4)]);
    // kurangi stok
    for (let j = 0; j < mProduk.getRowCount(); j++) {
      if (mProduk.getValueAt(j, 0) === id) {
        mProduk.setValueAt(mProduk.getValueAt(j, 3) - qty, j, 3);
        break;
      }
    }
  }
  detailTrx.set(no, items);
  mTransaksi.addRow([no, tgl, userAktif, total, bayar, kembali]);

  tampilStruk(no, tgl, userAktif, items, total, bayar, kembali);

  mKeranjang.setRowCount(0);
  txtBayar.value = "";
  hitungTotal();
}

// ====================== CETAK STRUK ======================
function buatStruk(no, tgl, kasir, items, total, bayar, kembali) {
  let sb = "";
  const garis = "--------------------------------------\n";
  sb += "        TOKO Septri Ponsel\n";
  sb += "        Jl. Kartini. Teluk Dalam, Nias Selatan\n";
  sb += garis;
  sb += "No     : " + no + "\n";
  sb += "Tanggal: " + tgl + "\n";
  sb += "Kasir  : " + kasir + "\n";
  sb += garis;
  for (const it of items) {
    sb += it[0] + "\n";
    sb += "  " + it[2] + " x " + padEnd(rp(it[1]), 12) + " " + padStart(rp(it[3]), 14) + "\n";
  }
  sb += garis;
  sb += padEnd("TOTAL", 14) + " " + padStart(rp(total), 22) + "\n";
  sb += padEnd("BAYAR", 14) + " " + padStart(rp(bayar), 22) + "\n";
  sb += padEnd("KEMBALI", 14) + " " + padStart(rp(kembali), 22) + "\n";
  sb += garis;
  sb += "     Terima kasih atas kunjungan Anda\n";
  return sb;
}

function tampilStruk(no, tgl, kasir, items, total, bayar, kembali) {
  const area = document.createElement("pre");
  area.className = "struk";
  area.textContent = buatStruk(no, tgl, kasir, items, total, bayar, kembali);

  dialog({
    judul: "Struk Pembelian " + no,
    isi: area,
    lebar: "460px",
    tombol: [
      {
        label: "Cetak", utama: true,
        aksi: () => {
          try { window.print(); }
          catch (ex) { info("Gagal mencetak: " + ex.message); }
          return false; // dialog tetap terbuka, seperti versi Java
        }
      },
      { label: "Tutup" }
    ]
  });
}

// ====================== DETAIL TRANSAKSI + DETAIL PEMBELIAN ======================
function tampilDetailPembelian(no) {
  const m = model("Nama HP", "Harga", "Qty", "Subtotal");
  for (const it of detailTrx.get(no))
    m.addRow([it[0], rp(it[1]), it[2], rp(it[3])]);

  const wrap = document.createElement("div");
  wrap.className = "tablewrap";
  const tbl = document.createElement("table");
  wrap.appendChild(tbl);
  buatTabel(tbl, m, [T, { f: v => v, num: true }, N, { f: v => v, num: true }], "Tidak ada item.");

  dialog({ judul: "Detail Pembelian " + no, isi: wrap, lebar: "560px", tombol: [{ label: "Tutup", utama: true }] });
}

// ====================== KELOLA PRODUK (ADMIN) ======================
/** row = -1 untuk tambah, selain itu ubah baris tersebut */
function formProduk(row) {
  const f = document.createElement("div");
  f.className = "form-grid";
  function baris(label, idEl, nilai, readonly, mode) {
    const l = document.createElement("label");
    l.htmlFor = idEl; l.textContent = label;
    const i = document.createElement("input");
    i.id = idEl; i.type = "text"; i.value = nilai; i.autocomplete = "off";
    if (mode) i.inputMode = mode;
    if (readonly) i.readOnly = true;
    f.append(l, i);
    return i;
  }
  const id = baris("ID:", "fId", row < 0 ? "" : String(mProduk.getValueAt(row, 0)), row >= 0);
  const nama = baris("Nama HP:", "fNama", row < 0 ? "" : String(mProduk.getValueAt(row, 1)), false);
  const harga = baris("Harga:", "fHarga", row < 0 ? "" : String(mProduk.getValueAt(row, 2)), false, "numeric");
  const stok = baris("Stok:", "fStok", row < 0 ? "" : String(mProduk.getValueAt(row, 3)), false, "numeric");

  dialog({
    judul: row < 0 ? "Tambah Produk" : "Ubah Produk",
    isi: f,
    tombol: [
      { label: "Batal" },
      {
        label: "Simpan", utama: true,
        aksi: () => {
          if (id.value.trim() === "" || nama.value.trim() === "") {
            info("ID dan Nama wajib diisi."); return false;
          }
          if (row < 0) {
            for (let i = 0; i < mProduk.getRowCount(); i++)
              if (mProduk.getValueAt(i, 0) === id.value.trim()) { info("ID sudah dipakai."); return false; }
            mProduk.addRow([id.value.trim(), nama.value.trim(), angka(harga.value), angka(stok.value)]);
          } else {
            mProduk.setValueAt(nama.value.trim(), row, 1);
            mProduk.setValueAt(angka(harga.value), row, 2);
            mProduk.setValueAt(angka(stok.value), row, 3);
          }
          return true;
        }
      }
    ]
  });
}

// ====================== PASANG EVENT ======================
// Login
document.getElementById("formLogin").addEventListener("submit", e => { e.preventDefault(); prosesLogin(); });

// Dashboard
document.getElementById("b1").addEventListener("click", () => pindah("penjualan"));
document.getElementById("b2").addEventListener("click", () => pindah("transaksi"));
btnKelolaProduk.addEventListener("click", () => pindah("produk"));
document.getElementById("b4").addEventListener("click", () => logout());

// Penjualan
document.getElementById("btnTambah").addEventListener("click", () => tambahKeranjang());
document.getElementById("btnHapus").addEventListener("click", () => {
  const r = tKeranjang.getSelectedRow();
  if (r < 0) { info("Pilih item di keranjang dulu."); return; }
  mKeranjang.removeRow(r);
  hitungTotal();
});
document.getElementById("btnKosong").addEventListener("click", () => { mKeranjang.setRowCount(0); hitungTotal(); });
document.getElementById("btnBayar").addEventListener("click", () => prosesPembelian());
document.getElementById("btnKembali").addEventListener("click", () => pindah("dashboard"));
txtBayar.addEventListener("keyup", () => hitungTotal());
txtBayar.addEventListener("input", () => hitungTotal());

// Transaksi
document.getElementById("bDetail").addEventListener("click", () => {
  const r = tTransaksi.getSelectedRow();
  if (r < 0) { info("Pilih transaksi dulu."); return; }
  tampilDetailPembelian(mTransaksi.getValueAt(r, 0));
});
document.getElementById("bStruk").addEventListener("click", () => {
  const r = tTransaksi.getSelectedRow();
  if (r < 0) { info("Pilih transaksi dulu."); return; }
  const no = mTransaksi.getValueAt(r, 0);
  tampilStruk(no, mTransaksi.getValueAt(r, 1), mTransaksi.getValueAt(r, 2),
    detailTrx.get(no), mTransaksi.getValueAt(r, 3),
    mTransaksi.getValueAt(r, 4), mTransaksi.getValueAt(r, 5));
});
document.getElementById("bKembaliTrx").addEventListener("click", () => pindah("dashboard"));

// Kelola produk
document.getElementById("bTambah").addEventListener("click", () => formProduk(-1));
document.getElementById("bUbah").addEventListener("click", () => {
  const r = tProdukAdmin.getSelectedRow();
  if (r < 0) { info("Pilih produk dulu."); return; }
  formProduk(r);
});
document.getElementById("bHapus").addEventListener("click", () => {
  const r = tProdukAdmin.getSelectedRow();
  if (r < 0) { info("Pilih produk dulu."); return; }
  dialog({
    judul: "Konfirmasi", isi: "Hapus produk ini?",
    tombol: [
      { label: "Tidak" },
      { label: "Ya", utama: true, aksi: () => { mProduk.removeRow(r); } }
    ]
  });
});
document.getElementById("bKembaliPrd").addEventListener("click", () => pindah("dashboard"));

// ====================== MAIN ======================
isiDataAwal();
tampilkan("login");
</script>
